# Serving the viewer under /docs/ on an existing site, behind the site's own login.
# The container listens on 127.0.0.1:3003 (DOCS_LISTEN=127.0.0.1:3003 with network_mode: host,
# or a '127.0.0.1:3003:80' port mapping).

location = /docs {
    return 301 /docs/;
}

location ^~ /docs/ {
    # Access control is the host's job. For example with auth_request against your app:
    #   auth_request /_docs_auth;
    #   error_page 401 = @login;

    # The trailing slash strips the /docs/ prefix; the viewer only uses relative paths.
    proxy_pass http://127.0.0.1:3003/;
    proxy_set_header Host $host;
}
