# Shared by /files/ and /source/. Only a few binary types get their real MIME type; everything
# else (.md, .mmd, .ts, .yml, Dockerfile, ...) is plain text. nginx's mime.types would serve .ts
# as video/mp2t, for one.
types {
    image/png       png;
    image/jpeg      jpg jpeg;
    image/gif       gif;
    image/webp      webp;
    image/svg+xml   svg;
    application/pdf pdf;
    application/json json;
}
default_type text/plain;
charset utf-8;
charset_types text/plain application/json;

# Files opened directly (e.g. an SVG via "Raw") can't run scripts in the viewer's origin.
add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; sandbox" always;
add_header Cache-Control "no-store" always;
add_header X-Content-Type-Options "nosniff" always;
